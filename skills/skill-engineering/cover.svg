<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title description">
  <title id="title">Skill engineering: observe, isolate, evaluate, decide</title>
  <desc id="description">A four-step workflow for improving coding-agent skills from recurring evidence without endless self-rewriting.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#101426"/><stop offset="100%" stop-color="#080c18"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a786ff"/><stop offset="50%" stop-color="#f692c8"/><stop offset="100%" stop-color="#65dfd6"/></linearGradient>
    <radialGradient id="glow"><stop offset="0%" stop-color="#a786ff" stop-opacity=".25"/><stop offset="100%" stop-color="#a786ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1070" cy="90" r="345" fill="url(#glow)"/><circle cx="155" cy="530" r="260" fill="url(#glow)" opacity=".35"/>
  <path d="M62 38h1076M62 590h1076" stroke="#64708c" stroke-opacity=".28"/>
  <text x="62" y="88" fill="#d5c9ff" font-size="23" font-family="Arial,Helvetica,sans-serif" letter-spacing="1" font-weight="700">r8stack</text>
  <text x="1138" y="88" fill="#c3ccdf" text-anchor="end" font-size="15" font-family="Arial,Helvetica,sans-serif" letter-spacing="2" font-weight="700">05 / SKILL IMPROVEMENT</text>
  <text x="62" y="167" fill="#ffffff" font-size="60" font-family="Arial,Helvetica,sans-serif" font-weight="800" letter-spacing="-1.8">Skill engineering</text>
  <text x="64" y="210" fill="#bcc7dd" font-size="23" font-family="Arial,Helvetica,sans-serif">Improve instructions from evidence, then stop.</text>
  <g stroke-width="1.8"><rect x="60" y="260" width="250" height="238" rx="22" fill="#222441" stroke="#9889ff" stroke-opacity=".7"/><rect x="337" y="260" width="250" height="238" rx="22" fill="#38253c" stroke="#fa9cc3" stroke-opacity=".7"/><rect x="614" y="260" width="250" height="238" rx="22" fill="#193439" stroke="#71dbce" stroke-opacity=".7"/><rect x="891" y="260" width="250" height="238" rx="22" fill="#243148" stroke="#85cafa" stroke-opacity=".7"/></g>
  <g><circle cx="98" cy="304" r="20" fill="#a992ff"/><circle cx="375" cy="304" r="20" fill="#ffabcb"/><circle cx="652" cy="304" r="20" fill="#81e1d2"/><circle cx="929" cy="304" r="20" fill="#8fcbff"/></g>
  <g fill="#151827" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="20" text-anchor="middle"><text x="98" y="311">1</text><text x="375" y="311">2</text><text x="652" y="311">3</text><text x="929" y="311">4</text></g>
  <g fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800"><text x="83" y="376">OBSERVE</text><text x="360" y="376">ISOLATE</text><text x="637" y="376">EVALUATE</text><text x="914" y="376">DECIDE</text></g>
  <g fill="#dce2f0" font-family="Arial,Helvetica,sans-serif" font-size="18"><text x="83" y="417">Recurring evidence</text><text x="83" y="445">User impact</text><text x="360" y="417">Root-cause layer</text><text x="360" y="445">One hypothesis</text><text x="637" y="417">Fixed benchmark</text><text x="637" y="445">Trade-offs</text><text x="914" y="417">Approval</text><text x="914" y="445">Stop condition</text></g>
  <g fill="none" stroke="#d4dcf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M315 380h17m-7-7 7 7-7 7"/><path d="M592 380h17m-7-7 7 7-7 7"/><path d="M869 380h17m-7-7 7 7-7 7"/></g>
  <path d="M1018 517 Q603 568 184 517" fill="none" stroke="url(#edge)" stroke-width="3" stroke-dasharray="9 9" stroke-linecap="round"/>
  <text x="602" y="558" text-anchor="middle" fill="#c9d2e7" font-size="17" font-family="Arial,Helvetica,sans-serif" letter-spacing="2.6" font-weight="700">LEARN · TEST · DECIDE</text>
</svg>
