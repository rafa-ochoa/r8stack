<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title description"><title id="title">r8stack trust model</title><desc id="description">Deterministic constraints and runtime evidence support increasing autonomy, while an owner approval boundary remains for consequential changes.</desc><defs><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#f7f8ff}.x{font-family:Arial,Helvetica,sans-serif;fill:#cbd4eb;font-size:16px}.b{stroke-width:2;rx:16}</style></defs><rect width="1200" height="360" fill="#10182c"/><text class="t" x="55" y="60" font-size="27" font-weight="700">Trust model: autonomy is earned, never assumed</text><path d="M80 280H1110" stroke="#7180a4" stroke-width="3"/><path d="M1100 270L1130 280L1100 290" fill="#7180a4"/><text class="x" x="70" y="325">less autonomy</text><text class="x" x="1000" y="325">more autonomy</text><g class="b"><rect x="120" y="205" width="230" height="75" fill="#24334c" stroke="#83d6c5"/><rect x="420" y="155" width="250" height="125" fill="#1f3557" stroke="#6da8ff"/><rect x="740" y="105" width="270" height="175" fill="#382f5e" stroke="#b9a1ff"/></g><g class="t" font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="235" y="238" font-size="18" font-weight="700">Deterministic constraints</text><text x="235" y="262" font-size="14">types · validators · tests</text><text x="545" y="194" font-size="18" font-weight="700">Runtime verification</text><text x="545" y="220" font-size="14">behavior · traces · screenshots</text><text x="875" y="145" font-size="18" font-weight="700">Evidence-backed delegation</text><text x="875" y="172" font-size="14">bounded workflows · reproducible artifacts</text><text x="875" y="228" font-size="15" fill="#f3c56b">Owner approval remains required</text></g></svg>
