<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="title description">
  <title id="title">r8stack trust model</title>
  <desc id="description">Deterministic constraints, runtime verification and evidence-backed delegation support increasing autonomy, while owner approval remains required for consequential changes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#101426"/><stop offset="100%" stop-color="#080c18"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#65dfd6"/><stop offset="50%" stop-color="#85cafa"/><stop offset="100%" stop-color="#a786ff"/></linearGradient>
    <radialGradient id="glow"><stop offset="0%" stop-color="#42d7c6" stop-opacity=".24"/><stop offset="100%" stop-color="#42d7c6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#background)"/>
  <circle cx="1040" cy="102" r="340" fill="url(#glow)"/><circle cx="155" cy="540" r="245" fill="url(#glow)" opacity=".3"/>
  <path d="M62 38h1076M62 600h1076" stroke="#64708c" stroke-opacity=".28"/>
  <text x="62" y="88" fill="#c9f7f0" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1">r8stack</text>
  <text x="1138" y="88" fill="#c3ccdf" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="2" text-anchor="end">TRUST MODEL</text>
  <text x="62" y="167.2" fill="#ffffff" font-size="60" font-family="Arial,Helvetica,sans-serif" font-weight="800" letter-spacing="-1.8">Autonomy is earned</text><text x="64" y="210.89999999999998" fill="#bcc7dd" font-size="23" font-family="Arial,Helvetica,sans-serif" >Each layer adds evidence you can rerun. Approval never goes away.</text>
  <rect x="62" y="390" width="342" height="155" rx="22" fill="#193439" stroke="#71dbce" stroke-opacity="0.7" stroke-width="1.8"/><text x="86" y="438" fill="#ffffff" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800">DETERMINISTIC</text><text x="86" y="468" fill="#ffffff" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800">CONSTRAINTS</text><text x="86" y="507.4" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >Types, validators, tests</text><rect x="429" y="350" width="342" height="195" rx="22" fill="#243148" stroke="#85cafa" stroke-opacity="0.7" stroke-width="1.8"/><text x="453" y="398" fill="#ffffff" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800">RUNTIME</text><text x="453" y="428" fill="#ffffff" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800">VERIFICATION</text><text x="453" y="467.4" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >Behavior, traces, screenshots</text><rect x="796" y="310" width="342" height="235" rx="22" fill="#222441" stroke="#a992ff" stroke-opacity="0.7" stroke-width="1.8"/><text x="820" y="358" fill="#ffffff" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800">EVIDENCE-BACKED</text><text x="820" y="388" fill="#ffffff" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800">DELEGATION</text><text x="820" y="427.4" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >Bounded workflows, reproducible</text><text x="820" y="450.79999999999995" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >artifacts</text><text x="62" y="268" fill="#ffabcb" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="2.6">OWNER APPROVAL REMAINS REQUIRED</text><path d="M500 263H1138" stroke="#ffabcb" stroke-width="2" stroke-dasharray="9 9" stroke-linecap="round"/><path d="M260 575H915" stroke="#85cafa" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/><path d="M916 575h17m-7-7 7 7-7 7" fill="none" stroke="#d4dcf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="581" fill="#c9d2e7" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="2.6">LESS AUTONOMY</text><text x="1138" y="581" fill="#c9d2e7" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="2.6" text-anchor="end">MORE AUTONOMY</text>
</svg>
