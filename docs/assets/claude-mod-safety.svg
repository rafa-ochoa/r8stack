<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" aria-labelledby="title description">
  <title id="title">Claude Mod safety floor</title><desc id="description">Three TokenEconomizer mechanisms are bounded by a verification safety floor that preserves evidence and approval.</desc>
  <defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#101426"/><stop offset="100%" stop-color="#080c18"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#65dfd6"/><stop offset="100%" stop-color="#a786ff"/></linearGradient></defs>
  <rect width="1200" height="530" fill="url(#background)"/><path d="M62 38h1076M62 490h1076" stroke="#64708c" stroke-opacity=".28"/><text x="62" y="88" fill="#c9f7f0" font-size="23" font-family="Arial,Helvetica,sans-serif" letter-spacing="1" font-weight="700">r8stack</text><text x="62" y="145" fill="#fff" font-size="38" font-family="Arial,Helvetica,sans-serif" font-weight="800">Mods optimize execution. They never decide correctness.</text>
  <g stroke-width="2"><rect x="60" y="210" width="250" height="150" rx="20" fill="#193439" stroke="#71dbce"/><rect x="337" y="210" width="250" height="150" rx="20" fill="#243148" stroke="#85cafa"/><rect x="614" y="210" width="250" height="150" rx="20" fill="#38253c" stroke="#ffabcb"/><rect x="900" y="190" width="240" height="190" rx="24" fill="#222441" stroke="#a992ff" stroke-width="3"/></g>
  <g fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800"><text x="85" y="258">MICRO-SKILLS</text><text x="362" y="258">TOOL PRUNING</text><text x="639" y="258">LOOP GUARD</text><text x="925" y="238">SAFETY FLOOR</text></g>
  <g fill="#dce2f0" font-family="Arial,Helvetica,sans-serif" font-size="17"><text x="85" y="296">Remember proven facts</text><text x="85" y="322">Never replace evidence</text><text x="362" y="296">Propose unused tools</text><text x="362" y="322">Review and restore first</text><text x="639" y="296">Redirect repeated failure</text><text x="639" y="322">Never declare success</text><text x="925" y="280">Keep errors, paths,</text><text x="925" y="306">output, checks, review,</text><text x="925" y="332">approval and rollback</text><text x="925" y="358">evidence intact</text></g>
  <path d="M80 410H1120" stroke="url(#edge)" stroke-width="4"/><text x="600" y="455" text-anchor="middle" fill="#c9d2e7" font-size="17" font-family="Arial,Helvetica,sans-serif" letter-spacing="2.2" font-weight="700">EXPLICIT APPROVAL · REVERSIBLE CHANGE · REAL VERIFICATION</text>
</svg>
