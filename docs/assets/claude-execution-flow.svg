<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title description">
  <title id="title">Claude execution workflow</title><desc id="description">A request routes to the appropriate r8a skill, with delivery verification at the center and optional regression, efficiency, and skill-improvement paths.</desc>
  <defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#101426"/><stop offset="100%" stop-color="#080c18"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a786ff"/><stop offset="50%" stop-color="#65dfd6"/><stop offset="100%" stop-color="#85cafa"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d4dcf3"/></marker></defs>
  <rect width="1200" height="720" fill="url(#background)"/><path d="M62 38h1076M62 680h1076" stroke="#64708c" stroke-opacity=".28"/>
  <text x="62" y="88" fill="#d5c9ff" font-size="23" font-family="Arial,Helvetica,sans-serif" letter-spacing="1" font-weight="700">r8a-skills</text><text x="1138" y="88" fill="#c3ccdf" text-anchor="end" font-size="15" font-family="Arial,Helvetica,sans-serif" letter-spacing="2" font-weight="700">CLAUDE CODE WORKFLOW</text>
  <text x="62" y="150" fill="#fff" font-size="48" font-family="Arial,Helvetica,sans-serif" font-weight="800">One delivery flow, clear owners</text><text x="62" y="190" fill="#bcc7dd" font-size="21" font-family="Arial,Helvetica,sans-serif">Choose the skill that matches the work. Optional evidence never replaces delivery verification.</text>
  <rect x="60" y="250" width="190" height="96" rx="18" fill="#222441" stroke="#a992ff" stroke-width="2"/><text x="155" y="291" text-anchor="middle" fill="#fff" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="800">REQUEST</text><text x="155" y="320" text-anchor="middle" fill="#dce2f0" font-size="16" font-family="Arial,Helvetica,sans-serif">scope and evidence</text>
  <g stroke-width="2"><rect x="340" y="226" width="250" height="118" rx="18" fill="#193439" stroke="#71dbce"/><rect x="700" y="226" width="250" height="118" rx="18" fill="#243148" stroke="#85cafa"/><rect x="340" y="438" width="250" height="118" rx="18" fill="#38253c" stroke="#ffabcb"/><rect x="700" y="438" width="250" height="118" rx="18" fill="#222441" stroke="#a992ff"/></g>
  <g fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23"><text x="365" y="272">JUDGMENT-LED</text><text x="365" y="301">DELIVERY</text><text x="725" y="272">VERIFIED</text><text x="725" y="301">DELIVERY</text><text x="365" y="484">VERIFY REGRESSION</text><text x="365" y="513">TESTS</text><text x="725" y="484">EFFICIENT</text><text x="725" y="513">EXECUTION</text></g>
  <g fill="#dce2f0" font-family="Arial,Helvetica,sans-serif" font-size="16"><text x="365" y="326">Decide and build</text><text x="725" y="326">Evidence and review</text><text x="365" y="538">Named-test proof</text><text x="725" y="538">Reversible Mod pilot</text></g>
  <path d="M250 298h82" stroke="#d4dcf3" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 285h102" stroke="#d4dcf3" stroke-width="3" marker-end="url(#arrow)"/><path d="M825 352v78" stroke="#d4dcf3" stroke-width="3" marker-end="url(#arrow)"/><path d="M465 344v86" stroke="#d4dcf3" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="970" y="386" width="170" height="170" rx="18" fill="#1b3341" stroke="#65dfd6" stroke-width="2"/><text x="995" y="433" fill="#fff" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="800">SKILL</text><text x="995" y="460" fill="#fff" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="800">ENGINEERING</text><text x="995" y="500" fill="#dce2f0" font-size="15" font-family="Arial,Helvetica,sans-serif">Only after repeated,</text><text x="995" y="522" fill="#dce2f0" font-size="15" font-family="Arial,Helvetica,sans-serif">attributable evidence</text><path d="M950 497h12" stroke="#d4dcf3" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1030 592Q600 650 184 592" fill="none" stroke="url(#edge)" stroke-width="3" stroke-dasharray="9 9"/><text x="602" y="638" text-anchor="middle" fill="#c9d2e7" font-size="17" font-family="Arial,Helvetica,sans-serif" letter-spacing="2.4" font-weight="700">DECIDE · DELIVER · PROVE · OPTIMIZE · LEARN</text>
</svg>
