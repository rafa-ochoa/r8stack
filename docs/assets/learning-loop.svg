<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title description">
  <title id="title">r8stack learning loop</title>
  <desc id="description">A repeated, attributable failure is traced to its root cause, turned into a narrow proposal, evaluated against a fixed baseline, and promoted only with human approval.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#101426"/><stop offset="100%" stop-color="#080c18"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#65dfd6"/><stop offset="50%" stop-color="#85cafa"/><stop offset="100%" stop-color="#a786ff"/></linearGradient>
    <radialGradient id="glow"><stop offset="0%" stop-color="#42d7c6" stop-opacity=".24"/><stop offset="100%" stop-color="#42d7c6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#background)"/>
  <circle cx="1040" cy="102" r="340" fill="url(#glow)"/><circle cx="155" cy="600" r="245" fill="url(#glow)" opacity=".3"/>
  <path d="M62 38h1076M62 660h1076" stroke="#64708c" stroke-opacity=".28"/>
  <text x="62" y="88" fill="#c9f7f0" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1">r8stack</text>
  <text x="1138" y="88" fill="#c3ccdf" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="2" text-anchor="end">LEARNING LOOP</text>
  <text x="62" y="167.2" fill="#ffffff" font-size="60" font-family="Arial,Helvetica,sans-serif" font-weight="800" letter-spacing="-1.8">Learning loop</text><text x="64" y="210.89999999999998" fill="#bcc7dd" font-size="23" font-family="Arial,Helvetica,sans-serif" >Repeated failures become measured, human-approved improvements.</text>
  <rect x="62" y="255" width="196" height="250" rx="22" fill="#38253c" stroke="#ffabcb" stroke-opacity="0.7" stroke-width="1.8"/><circle cx="100" cy="293" r="18" fill="#ffabcb"/><text x="100" y="300" fill="#151827" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">1</text><text x="82" y="353" fill="#ffffff" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="800">FAILURE</text><text x="82" y="391.1" fill="#dce2f0" font-size="17" font-family="Arial,Helvetica,sans-serif" >Repeated and</text><text x="82" y="413.20000000000005" fill="#dce2f0" font-size="17" font-family="Arial,Helvetica,sans-serif" >attributable</text><rect x="282" y="255" width="196" height="250" rx="22" fill="#243148" stroke="#85cafa" stroke-opacity="0.7" stroke-width="1.8"/><circle cx="320" cy="293" r="18" fill="#8fcbff"/><text x="320" y="300" fill="#151827" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">2</text><text x="302" y="353" fill="#ffffff" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="800">ROOT CAUSE</text><text x="302" y="391.1" fill="#dce2f0" font-size="17" font-family="Arial,Helvetica,sans-serif" >Product, tooling or</text><text x="302" y="413.20000000000005" fill="#dce2f0" font-size="17" font-family="Arial,Helvetica,sans-serif" >skill</text><rect x="502" y="255" width="196" height="250" rx="22" fill="#222441" stroke="#a992ff" stroke-opacity="0.7" stroke-width="1.8"/><circle cx="540" cy="293" r="18" fill="#a992ff"/><text x="540" y="300" fill="#151827" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">3</text><text x="522" y="353" fill="#ffffff" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="800">PROPOSAL</text><text x="522" y="391.1" fill="#dce2f0" font-size="17" font-family="Arial,Helvetica,sans-serif" >One narrow</text><text x="522" y="413.20000000000005" fill="#dce2f0" font-size="17" font-family="Arial,Helvetica,sans-serif" >hypothesis</text><rect x="722" y="255" width="196" height="250" rx="22" fill="#193439" stroke="#71dbce" stroke-opacity="0.7" stroke-width="1.8"/><circle cx="760" cy="293" r="18" fill="#81e1d2"/><text x="760" y="300" fill="#151827" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">4</text><text x="742" y="353" fill="#ffffff" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="800">EVALUATION</text><text x="742" y="391.1" fill="#dce2f0" font-size="17" font-family="Arial,Helvetica,sans-serif" >Baseline vs</text><text x="742" y="413.20000000000005" fill="#dce2f0" font-size="17" font-family="Arial,Helvetica,sans-serif" >candidate, 3+ runs</text><text x="742" y="435.30000000000007" fill="#dce2f0" font-size="17" font-family="Arial,Helvetica,sans-serif" >each</text><text x="742" y="485" fill="#71dbce" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1.5">RUNS: MANUAL</text><rect x="942" y="255" width="196" height="250" rx="22" fill="#193439" stroke="#71dbce" stroke-opacity="0.7" stroke-width="1.8"/><circle cx="980" cy="293" r="18" fill="#81e1d2"/><text x="980" y="300" fill="#151827" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">5</text><text x="962" y="353" fill="#ffffff" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="800">APPROVAL</text><text x="962" y="391.1" fill="#dce2f0" font-size="17" font-family="Arial,Helvetica,sans-serif" >A person promotes</text><text x="962" y="413.20000000000005" fill="#dce2f0" font-size="17" font-family="Arial,Helvetica,sans-serif" >or rejects</text><path d="M261 335h17m-7-7 7 7-7 7" fill="none" stroke="#d4dcf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M481 335h17m-7-7 7 7-7 7" fill="none" stroke="#d4dcf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M701 335h17m-7-7 7 7-7 7" fill="none" stroke="#d4dcf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M921 335h17m-7-7 7 7-7 7" fill="none" stroke="#d4dcf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1040 517 Q600 553 160 517" fill="none" stroke="url(#edge)" stroke-width="3" stroke-dasharray="9 9" stroke-linecap="round"/><text x="600" y="579" fill="#c9d2e7" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-weight="700" letter-spacing="2.6">EVIDENCE CHANGES THE SYSTEM ONLY WITH APPROVAL</text>
  <text x="62" y="638" fill="#9aa6c0" font-size="16" font-family="Arial,Helvetica,sans-serif" >Implemented: evaluation policy, versioned eval sets, comparison runner. Planned: automated agent runs.</text>
</svg>
