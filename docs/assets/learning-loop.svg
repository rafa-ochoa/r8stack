<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="title description"><title id="title">r8stack learning loop</title><desc id="description">A recurring failure is traced to its root cause, evaluated as a guardrail proposal, and requires human approval before integration.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f3c56b"/></marker><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#f7f8ff}.l{stroke:#f3c56b;stroke-width:3;fill:none;marker-end:url(#a)}.b{fill:#382f5e;stroke:#b9a1ff;stroke-width:2;rx:18}</style></defs><rect width="1200" height="390" fill="#10182c"/><text class="t" x="55" y="58" font-size="27" font-weight="700">Learning loop: evidence changes the system only with approval</text><path class="l" d="M232 210H288M457 210H513M682 210H738M907 210H963M1035 270C920 365 260 365 160 275"/><g class="b"><rect x="55" y="150" width="177" height="120"/><rect x="288" y="150" width="169" height="120"/><rect x="513" y="150" width="169" height="120"/><rect x="738" y="150" width="169" height="120"/><rect x="963" y="150" width="170" height="120"/></g><g class="t" font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g font-size="18" font-weight="700"><text x="144" y="192">Failure</text><text x="372" y="192">Root cause</text><text x="597" y="192">Guardrail proposal</text><text x="822" y="192">Fixed evaluation</text><text x="1048" y="192">Human approval</text></g><g font-size="13" fill="#cbd4eb"><text x="144" y="220">repeated + attributable</text><text x="372" y="220">product, tooling or skill</text><text x="597" y="220">narrow hypothesis</text><text x="822" y="220">baseline vs candidate</text><text x="1048" y="220">promote or reject</text></g></g><text class="t" x="55" y="340" font-size="15">Implemented: evidence policy and versioned skill evaluations. Automated evaluation runner: planned, not represented as active automation.</text></svg>
