<svg xmlns="http://www.w3.org/2000/svg" width="880" height="760" viewBox="0 0 880 760" role="img" aria-labelledby="title description">
  <title id="title">From a diff to a reviewable handoff</title>
  <desc id="description">An implemented diff is verified through repository checks, real behavior and validated review findings. A confirmed defect returns to implementation when edits are authorized, with at most three review-and-fix rounds. The handoff carries revision-bound evidence and risks. Owner authorization remains required for commit, push, merge, deployment and publication.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101426" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="760" fill="url(#background)" />
  <text x="44" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#f7f8ff">From a diff to a reviewable handoff</text>
  <text x="44" y="103" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#cbd4eb">Verify the implemented revision.</text>
  <rect x="44" y="155" width="220" height="225" fill="#193439" id="implement" stroke="#71dbce" stroke-width="1.5" />
  <rect x="330" y="155" width="220" height="225" fill="#243148" id="verify" stroke="#85cafa" stroke-width="1.5" />
  <rect x="616" y="155" width="220" height="225" fill="#222441" id="handoff" stroke="#a992ff" stroke-width="1.5" />
  <text x="64" y="201" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#f7f8ff">Working diff</text>
  <text x="64" y="250" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#cbd4eb">Goal + limits</text>
  <text x="64" y="287" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#cbd4eb">Changed flows</text>
  <text x="64" y="324" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#cbd4eb">Decisions</text>
  <text x="350" y="201" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#9bcfff">Verify</text>
  <text x="350" y="250" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#cbd4eb">Repo checks</text>
  <text x="350" y="287" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#cbd4eb">Real behavior</text>
  <text x="350" y="324" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#cbd4eb">Review findings</text>
  <text x="636" y="201" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#f7f8ff">Handoff</text>
  <text x="636" y="250" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#cbd4eb">Revision + results</text>
  <text x="636" y="287" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#cbd4eb">Flows + artifacts</text>
  <text x="636" y="324" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#cbd4eb">Risks + rollback</text>
  <g id="implement-verify">
    <polyline points="264,270 318,270" fill="none" stroke="#85cafa" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="330,270 318,275 318,265" fill="#85cafa" />
  </g>
  <g id="verify-handoff">
    <polyline points="550,270 604,270" fill="none" stroke="#a992ff" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="616,270 604,275 604,265" fill="#a992ff" />
  </g>
  <g id="verify-implement">
    <polyline points="440,380 440,423 154,423 154,392" fill="none" stroke="#ffabcb" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="154,380 159,392 149,392" fill="#ffabcb" />
  </g>
  <text x="297" y="459" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#ffabcb" text-anchor="middle">Confirmed defect</text>
  <text x="44" y="505" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#ffabcb">Stop after 3 review-and-fix rounds or an owner-needed blocker.</text>
  <rect x="44" y="540" width="792" height="86" fill="#243148" id="revision-note" stroke="#85cafa" stroke-width="1.5" />
  <text x="64" y="574" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#f7f8ff">Code changed?</text>
  <text x="64" y="606" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#cbd4eb">Keep prior results labeled; rerun the affected checks.</text>
  <rect x="44" y="656" width="792" height="82" fill="#38253c" id="authorization" stroke="#ffabcb" stroke-width="1.5" />
  <text x="64" y="690" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#ffabcb">Owner authorization</text>
  <text x="64" y="724" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#f7f8ff">Commit · push · merge · deploy · publish</text>
</svg>
