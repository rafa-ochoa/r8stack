<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title description"><title id="title">r8stack end-to-end execution</title><desc id="description">A request moves through decision, planning, implementation, verification and an owner-controlled delivery boundary.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#7f90b9"/></marker><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#f7f8ff}.b{stroke:#7f90b9;stroke-width:2;rx:14}.l{stroke:#7f90b9;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="360" fill="#10182c"/><text class="t" x="55" y="60" font-size="27" font-weight="700">r8stack execution: evidence follows the work</text><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><path class="l" d="M215 190H270M405 190H460M595 190H650M785 190H840M975 190H1030"/><g fill="#1f3557" stroke="#6da8ff" class="b"><rect x="55" y="130" width="160" height="120"/><rect x="270" y="130" width="135" height="120"/><rect x="460" y="130" width="135" height="120"/><rect x="650" y="130" width="135" height="120"/><rect x="840" y="130" width="135" height="120"/><rect x="1030" y="130" width="115" height="120"/></g><g class="t" font-size="18" font-weight="700"><text x="135" y="178">Request</text><text x="337" y="178">Decision</text><text x="527" y="178">Planning</text><text x="717" y="178">Implementation</text><text x="907" y="178">Verification</text><text x="1087" y="178">Delivery</text></g><g fill="#cbd4eb" font-size="13"><text x="135" y="205">intent + limits</text><text x="337" y="205">alternatives</text><text x="527" y="205">risk + flows</text><text x="717" y="205">working diff</text><text x="907" y="205">checks + artifacts</text><text x="1087" y="205">owner decision</text></g></g><text class="t" x="55" y="310" font-size="15">Implemented: skills, optional delivery-flow, checks and feature-map artifacts. Delivery remains outside agent authority.</text></svg>
