<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title description">
  <title id="title">r8stack engineering system</title>
  <desc id="description">Product judgment routes work through skills and optional orchestration. Guardrails and runtime verification constrain delivery, while measured learning feeds approved improvements back into the system.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10182c"/><stop offset="1" stop-color="#1b1538"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#91a1c7"/></marker><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#f7f8ff}.k{font-family:Arial,Helvetica,sans-serif;fill:#b9c5e4;font-size:16px}.h{font-family:Arial,Helvetica,sans-serif;fill:#f7f8ff;font-size:21px;font-weight:700}.s{font-family:Arial,Helvetica,sans-serif;fill:#cbd4eb;font-size:15px}.box{stroke-width:2;rx:18}.line{stroke:#91a1c7;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="760" fill="url(#bg)"/><text class="t" x="60" y="68" font-size="25" font-weight="700" letter-spacing="2">r8stack</text><text class="t" x="60" y="116" font-size="40" font-weight="700">AI engineering that gets more reliable with every iteration</text><text class="k" x="60" y="148">Implemented capabilities are solid. Dashed boundaries are deliberate, opt-in extensions.</text>
  <path class="line" d="M270 275H358"/><path class="line" d="M582 275H670"/><path class="line" d="M894 275H982"/><path class="line" d="M780 375V464"/><path class="line" d="M555 575H358V376"/>
  <rect class="box" x="60" y="210" width="210" height="165" fill="#1f3557" stroke="#6da8ff"/><text class="h" x="84" y="252">Product judgment</text><text class="s" x="84" y="283">Requirements and</text><text class="s" x="84" y="305">alternatives; smallest</text><text class="s" x="84" y="327">valuable outcome</text><text class="k" x="84" y="354">Implemented</text>
  <rect class="box" x="358" y="210" width="224" height="165" fill="#24334c" stroke="#83d6c5"/><text class="h" x="382" y="252">Skills</text><text class="s" x="382" y="283">Focused capabilities</text><text class="s" x="382" y="305">with explicit boundaries</text><text class="k" x="382" y="354">Implemented</text>
  <rect class="box" x="670" y="210" width="224" height="165" fill="#382f5e" stroke="#b9a1ff"/><text class="h" x="694" y="252">Agent orchestration</text><text class="s" x="694" y="283">Select only needed stages;</text><text class="s" x="694" y="305">preserve handoffs</text><text class="k" x="694" y="354">Implemented, optional</text>
  <rect class="box" x="982" y="210" width="160" height="165" fill="#483147" stroke="#faacd5"/><text class="h" x="1006" y="252">Delivery</text><text class="s" x="1006" y="283">Owner approves</text><text class="s" x="1006" y="305">external change</text><text class="k" x="1006" y="354">Boundary</text>
  <rect class="box" x="570" y="465" width="420" height="150" fill="#29443d" stroke="#83d6c5"/><text class="h" x="598" y="507">Enforceable engineering + runtime verification</text><text class="s" x="598" y="538">Root-cause checks, regression proof, tests, traces, screenshots, feature maps</text><text class="k" x="598" y="582">Implemented: guardrail skill, evaluation and feature-map validators</text>
  <rect class="box" x="120" y="465" width="238" height="150" fill="#503d24" stroke="#f3c56b" stroke-dasharray="8 7"/><text class="h" x="144" y="507">Continuous improvement</text><text class="s" x="144" y="538">Fixed evaluations,</text><text class="s" x="144" y="560">baseline comparison,</text><text class="s" x="144" y="582">human promotion</text><text class="k" x="144" y="606">Implemented policy; runner planned</text>
  <text class="k" x="60" y="706">Trust grows only when deterministic constraints and observed evidence justify it. No stage authorizes publication by itself.</text>
</svg>
