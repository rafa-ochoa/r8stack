<svg xmlns="http://www.w3.org/2000/svg" width="880" height="930" viewBox="0 0 880 930" role="img" aria-labelledby="title description">
  <title id="title">How the seven skills fit</title>
  <desc id="description">delivery-flow is an explicitly invoked, optional coordinator. For delivery work, judgment-led-delivery builds a diff, verified-delivery establishes evidence, and the owner authorizes external actions. The four supporting skills are selected only when their task applies; they are not a required pipeline.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101426" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="930" fill="url(#background)" />
  <text x="44" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#f7f8ff">How the seven skills fit</text>
  <rect x="44" y="106" width="792" height="96" fill="#222441" id="coordinator" stroke="#a992ff" stroke-width="1.5" stroke-dasharray="7 5" />
  <text x="68" y="144" font-family="'Courier New',monospace" font-size="28" font-weight="700" fill="#bcaaff">delivery-flow</text>
  <text x="68" y="180" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#cbd4eb">Optional: prepares the next prompt and handoff.</text>
  <rect x="44" y="254" width="220" height="178" fill="#193439" id="build" stroke="#71dbce" stroke-width="1.5" />
  <rect x="330" y="254" width="220" height="178" fill="#243148" id="verify" stroke="#85cafa" stroke-width="1.5" />
  <rect x="616" y="254" width="220" height="178" fill="#38253c" id="owner" stroke="#ffabcb" stroke-width="1.5" />
  <text x="68" y="297" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#81e1d2">Build</text>
  <text x="68" y="340" font-family="'Courier New',monospace" font-size="22" font-weight="400" fill="#f7f8ff">judgment-led-</text>
  <text x="68" y="371" font-family="'Courier New',monospace" font-size="22" font-weight="400" fill="#f7f8ff">delivery</text>
  <text x="354" y="297" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#9bcfff">Verify</text>
  <text x="354" y="340" font-family="'Courier New',monospace" font-size="22" font-weight="400" fill="#f7f8ff">verified-</text>
  <text x="354" y="371" font-family="'Courier New',monospace" font-size="22" font-weight="400" fill="#f7f8ff">delivery</text>
  <text x="640" y="297" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#ffabcb">Approve</text>
  <text x="640" y="340" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#f7f8ff">Owner</text>
  <text x="640" y="371" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#f7f8ff">authorization</text>
  <g id="coordinator-build">
    <polyline points="154,202 154,242" fill="none" stroke="#a992ff" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" />
    <polygon points="154,254 149,242 159,242" fill="#a992ff" />
  </g>
  <g id="build-verify">
    <polyline points="264,343 318,343" fill="none" stroke="#d4dcf3" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="330,343 318,348 318,338" fill="#d4dcf3" />
  </g>
  <g id="verify-owner">
    <polyline points="550,343 604,343" fill="none" stroke="#ffabcb" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="616,343 604,348 604,338" fill="#ffabcb" />
  </g>
  <text x="297" y="323" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#cbd4eb" text-anchor="middle">diff</text>
  <text x="583" y="323" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#cbd4eb" text-anchor="middle">results</text>
  <text x="44" y="485" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#f7f8ff">Use supporting skills when needed</text>
  <path d="M44 514 L836 514" fill="none" stroke="#64708c" stroke-width="1.5" />
  <text x="44" y="549" font-family="'Courier New',monospace" font-size="27" font-weight="700" fill="#ffabcb">verify-regression-tests</text>
  <text x="44" y="583" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#cbd4eb">Prove a named test catches its bug.</text>
  <path d="M44 604 L836 604" fill="none" stroke="#64708c" stroke-width="1.5" />
  <text x="44" y="639" font-family="'Courier New',monospace" font-size="27" font-weight="700" fill="#81e1d2">enforceable-guardrails</text>
  <text x="44" y="673" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#cbd4eb">Prevent a failure at its root cause.</text>
  <path d="M44 694 L836 694" fill="none" stroke="#64708c" stroke-width="1.5" />
  <text x="44" y="729" font-family="'Courier New',monospace" font-size="27" font-weight="700" fill="#65dfd6">efficient-execution</text>
  <text x="44" y="763" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#cbd4eb">Evaluate an optimization without losing evidence.</text>
  <path d="M44 784 L836 784" fill="none" stroke="#64708c" stroke-width="1.5" />
  <text x="44" y="819" font-family="'Courier New',monospace" font-size="27" font-weight="700" fill="#bcaaff">skill-engineering</text>
  <text x="44" y="853" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#cbd4eb">Evaluate a skill revision after repeated failures.</text>
  <path d="M44 878 L836 878" fill="none" stroke="#64708c" stroke-width="1.5" />
  <text x="44" y="910" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#cbd4eb">Arrows show handoffs. Skills do not invoke each other.</text>
</svg>
