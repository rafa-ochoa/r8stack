<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title description">
  <title id="title">r8stack engineering system</title>
  <desc id="description">Product judgment, skills and optional orchestration lead to an owner-approved delivery boundary. Enforceable guardrails, runtime verification and continuous improvement apply across every stage.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#101426"/><stop offset="100%" stop-color="#080c18"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#65dfd6"/><stop offset="50%" stop-color="#85cafa"/><stop offset="100%" stop-color="#a786ff"/></linearGradient>
    <radialGradient id="glow"><stop offset="0%" stop-color="#42d7c6" stop-opacity=".24"/><stop offset="100%" stop-color="#42d7c6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#background)"/>
  <circle cx="1040" cy="102" r="340" fill="url(#glow)"/><circle cx="155" cy="800" r="245" fill="url(#glow)" opacity=".3"/>
  <path d="M62 38h1076M62 860h1076" stroke="#64708c" stroke-opacity=".28"/>
  <text x="62" y="88" fill="#c9f7f0" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1">r8stack</text>
  <text x="1138" y="88" fill="#c3ccdf" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="2" text-anchor="end">SYSTEM</text>
  <text x="62" y="167.2" fill="#ffffff" font-size="60" font-family="Arial,Helvetica,sans-serif" font-weight="800" letter-spacing="-1.8">Six capabilities, one boundary</text><text x="64" y="210.89999999999998" fill="#bcc7dd" font-size="23" font-family="Arial,Helvetica,sans-serif" >AI engineering that gets more reliable with every iteration.</text>
  <rect x="62" y="255" width="250" height="266" rx="22" fill="#243148" stroke="#85cafa" stroke-opacity="0.7" stroke-width="1.8"/><circle cx="102" cy="295" r="18" fill="#8fcbff"/><text x="102" y="302" fill="#151827" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">1</text><text x="84" y="356" fill="#ffffff" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="800">PRODUCT</text><text x="84" y="383" fill="#ffffff" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="800">JUDGMENT</text><text x="84" y="422.4" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >Smallest valuable</text><text x="84" y="445.79999999999995" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >outcome</text><text x="84" y="499" fill="#85cafa" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1.5">IMPLEMENTED</text><rect x="337" y="255" width="250" height="266" rx="22" fill="#193439" stroke="#71dbce" stroke-opacity="0.7" stroke-width="1.8"/><circle cx="377" cy="295" r="18" fill="#81e1d2"/><text x="377" y="302" fill="#151827" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">2</text><text x="359" y="356" fill="#ffffff" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="800">SKILLS</text><text x="359" y="395.4" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >Seven focused,</text><text x="359" y="418.79999999999995" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >installable skills</text><text x="359" y="499" fill="#71dbce" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1.5">IMPLEMENTED</text><rect x="612" y="255" width="250" height="266" rx="22" fill="#222441" stroke="#a992ff" stroke-opacity="0.7" stroke-width="1.8"/><circle cx="652" cy="295" r="18" fill="#a992ff"/><text x="652" y="302" fill="#151827" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">3</text><text x="634" y="356" fill="#ffffff" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="800">ORCHESTRATION</text><text x="634" y="395.4" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >Explicit handoffs between</text><text x="634" y="418.79999999999995" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >stages</text><text x="634" y="499" fill="#a992ff" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1.5">IMPLEMENTED · OPTIONAL</text><rect x="888" y="255" width="250" height="266" rx="22" fill="#38253c" stroke="#ffabcb" stroke-opacity="0.7" stroke-width="1.8"/><circle cx="928" cy="295" r="18" fill="#ffabcb"/><text x="928" y="302" fill="#151827" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">4</text><text x="910" y="356" fill="#ffffff" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="800">DELIVERY</text><text x="910" y="395.4" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >Owner approves every</text><text x="910" y="418.79999999999995" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >external change</text><text x="910" y="499" fill="#ffabcb" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1.5">BOUNDARY</text><path d="M315 380h17m-7-7 7 7-7 7" fill="none" stroke="#d4dcf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 380h17m-7-7 7 7-7 7" fill="none" stroke="#d4dcf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M866 380h17m-7-7 7 7-7 7" fill="none" stroke="#d4dcf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="557" fill="#c9d2e7" font-size="15" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-weight="700" letter-spacing="2.6">APPLIED ACROSS EVERY STAGE</text><rect x="62" y="581" width="342" height="200" rx="22" fill="#193439" stroke="#71dbce" stroke-opacity="0.7" stroke-width="1.8"/><text x="86" y="629" fill="#ffffff" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800">ENFORCEABLE</text><text x="86" y="659" fill="#ffffff" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800">GUARDRAILS</text><text x="86" y="698.4" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >Repeated failures become checks</text><text x="86" y="757" fill="#71dbce" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1.5">IMPLEMENTED</text><rect x="429" y="581" width="342" height="200" rx="22" fill="#243148" stroke="#85cafa" stroke-opacity="0.7" stroke-width="1.8"/><text x="453" y="629" fill="#ffffff" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800">RUNTIME</text><text x="453" y="659" fill="#ffffff" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800">VERIFICATION</text><text x="453" y="698.4" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >Evidence bound to the exact</text><text x="453" y="721.8" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >revision</text><text x="453" y="757" fill="#85cafa" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1.5">IMPLEMENTED</text><rect x="796" y="581" width="342" height="200" rx="22" fill="#222441" stroke="#a992ff" stroke-opacity="0.7" stroke-width="1.8"/><text x="820" y="629" fill="#ffffff" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800">CONTINUOUS</text><text x="820" y="659" fill="#ffffff" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800">IMPROVEMENT</text><text x="820" y="698.4" fill="#dce2f0" font-size="18" font-family="Arial,Helvetica,sans-serif" >Fixed evals, baseline vs candidate</text><text x="820" y="757" fill="#a992ff" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1.5">RUNNER BUILT · RUNS MANUAL</text>
  <text x="62" y="838" fill="#9aa6c0" font-size="16" font-family="Arial,Helvetica,sans-serif" >Everything shown is in the repository. Automated agent runs for evaluations are planned.</text>
